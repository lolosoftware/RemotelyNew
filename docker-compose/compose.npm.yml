# Copy beside your existing ./datas directory. Do not move or replace that directory.
services:
  remotely:
    image: ${REMOTELY_IMAGE:?Set the verified production image digest}
    container_name: remotely
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - ./datas:/app/AppData
    networks: [remotely]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: '5000'
      AllowedHosts: remacces.groupe-mi.com
      Remotely_ApplicationOptions__DbProvider: SQLite
      Remotely_ApplicationOptions__DockerGatewayIp: 172.28.0.1
      Remotely_ConnectionStrings__SQLite: Data Source=/app/AppData/Remotely.db
    healthcheck:
      test: [CMD, curl, --fail, -H, 'Host: remacces.groupe-mi.com', http://localhost:5000/api/healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 60s
networks:
  remotely:
    name: remotely-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
