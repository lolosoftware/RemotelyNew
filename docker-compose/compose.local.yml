# Local recipe only. Production uses compose.modern.yml with Caddy/HTTPS.
services:
  remotely:
    image: ${REMOTELY_IMAGE:-ghcr.io/lolosoftware/remotelynew:0.1.1-dev}
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:5080:8080'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: '8080'
      AllowedHosts: localhost;127.0.0.1
      Remotely_ApplicationOptions__DbProvider: SQLite
      Remotely_ConnectionStrings__SQLite: Data Source=/app/AppData/Remotely.db
    volumes:
      - remotely_local_data:/app/AppData
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 60s
volumes:
  remotely_local_data:
